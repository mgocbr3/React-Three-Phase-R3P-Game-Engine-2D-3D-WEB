[package]
name = "pixlplayground-studio"
version = "0.1.0"
description = "PixlPlayground Studio desktop shell"
authors = ["Pixlland"]
license = "UNLICENSED"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
